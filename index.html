<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미술 수행평가 채점표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<script>
/* =====================================================================
   설정 — 학기마다 바꿀 값은 모두 여기서 고치면 됩니다.
   (프로젝트 이름, 항목 이름, 배점은 화면의 [수정] 단추로도 바꿀 수 있어요.
    화면에서 바꾼 값이 있으면 그 값이 우선합니다.)
   ===================================================================== */
const CONFIG = {
  // 화면 맨 위 제목
  TITLE: "미술 수행평가 채점표",

  // 학생 선택 드롭다운
  STUDENT: {
    GRADES: [1, 3],          // 학년 목록
    CLASSES: [1, 2, 3, 4],   // 반 목록
    MAX_NUMBER: 30,          // 번호는 1번부터 이 번호까지
  },

  // 단계 이름 (단추에 표시되는 글자). 6개를 유지하세요.
  LEVELS: ["A", "B", "C", "D", "E", "F"],

  // 프로젝트와 채점 항목 (기본값)
  //  - points : A, B, C, D, E, F 순서의 배점
  //  - 한 프로젝트의 A 배점을 모두 더하면 만점(50점)이 됩니다.
  PROJECTS: [
    {
      name: "프로젝트 1",
      items: [
        { name: "아이디어 발상", points: [20, 17, 14, 11, 8, 5] },
        { name: "표현 기법",     points: [15, 13, 11,  9, 7, 5] },
        { name: "완성도",        points: [15, 13, 11,  9, 7, 5] },
      ],
    },
    {
      name: "프로젝트 2",
      items: [
        { name: "주제 해석",     points: [20, 17, 14, 11, 8, 5] },
        { name: "조형 요소 활용", points: [15, 13, 11,  9, 7, 5] },
        { name: "감상 및 성찰",   points: [15, 13, 11,  9, 7, 5] },
      ],
    },
  ],

  // 프로젝트 하나의 만점 (수정 화면에서 A 배점 합계를 확인할 때 씁니다)
  PROJECT_FULL_SCORE: 50,

  // 최종 등급 기준 (위에서부터 차례로 확인합니다)
  //  - min      : 기준 점수
  //  - inclusive: true면 "min점 이상", false면 "min점 초과"
  //  지금 설정: 80점 이상 A / 60점 초과 80점 미만 B / 60점 이하 C
  FINAL_GRADES: [
    { grade: "A", min: 80, inclusive: true },
    { grade: "B", min: 60, inclusive: false },
    { grade: "C", min: -Infinity, inclusive: true },
  ],

  // 이 브라우저에 저장할 때 쓰는 이름. 바꾸면 기존 기록과 따로 저장됩니다.
  STORAGE_KEY: "art-score-records-v1",
};
/* ===================================================================== */
</script>
<style>
  /* 색종이 콜라주 (paper-collage) 디자인 — 색은 아래 표의 색과 흰색만 씁니다 */
  :root {
    --board: #f4efe3;
    --ink: #33302b;
    --c1: #f26b4f;   /* tomato */
    --c2: #f7c548;   /* sun */
    --c3: #5fb38a;   /* leaf */
    --c4: #4a8fd6;   /* sea */
    --c5: #9b72cf;   /* plum */
    --shade: rgba(51,48,43,.18);
    --paper-shadow: 0 3px 0 var(--shade);
    --r: 6px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--board);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  h1, h2, .total-num, .grade-badge, .lv .l, .subtotal b {
    font-family: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-weight: 400;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px 64px; }

  /* 맨 위 색종이 띠 (아래 가장자리를 가위로 자른 물결) */
  .top {
    background: var(--c4);
    color: #fff;
    padding: 36px 0 52px;
    margin-bottom: 28px;
    -webkit-mask: radial-gradient(14px at 50% 100%, #0000 98%, #000) 50% 0 / 28px 100% repeat-x;
            mask: radial-gradient(14px at 50% 100%, #0000 98%, #000) 50% 0 / 28px 100% repeat-x;
  }
  .top .inner { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  h1 { margin: 0; font-size: clamp(32px, 5.6vw, 56px); line-height: 1.15; }

  /* 단추 공통 */
  button.btn {
    appearance: none; font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: var(--r);
    padding: 10px 20px; color: #fff;
    box-shadow: var(--paper-shadow);
  }
  button.btn:active { box-shadow: none; transform: translateY(3px); }
  .btn-save { background: var(--c1); }
  .btn-clear { background: var(--c3); }
  .btn-line { background: var(--c2); color: var(--ink) !important; }
  .btn-primary { background: var(--c4); }
  .btn-danger { background: var(--c1); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* 학생 선택 */
  .student {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    background: #fff; border-radius: var(--r);
    box-shadow: var(--paper-shadow);
    padding: 14px 18px; margin-bottom: 22px;
  }
  .student label { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .student select {
    font: inherit; font-weight: 700; color: var(--ink);
    background: var(--board); border: 0; border-radius: var(--r);
    box-shadow: var(--paper-shadow);
    padding: 6px 12px; min-width: 84px; cursor: pointer;
  }
  .student .hint { font-size: 15px; margin-left: auto; }
  .student .hint.exists { color: var(--ink); background: var(--c2); padding: 2px 10px; border-radius: var(--r); }

  /* 채점 영역 */
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
  .project {
    background: #fff;
    border-radius: var(--r);
    box-shadow: var(--paper-shadow);
    padding: 0 18px 12px;
    overflow: hidden;
  }
  .project[data-p="0"] { --c: var(--c4); }
  .project[data-p="1"] { --c: var(--c1); }
  .project-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--c); color: #fff;
    margin: 0 -18px 6px; padding: 12px 18px;
  }
  .project-head h2 { margin: 0; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.2; }
  .subtotal { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
  .subtotal b { font-size: 28px; }

  .item { padding: 12px 0; }
  .item + .item { box-shadow: 0 -2px 0 var(--board); }
  .item-name { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; gap: 8px; }
  .item-name span:last-child { font-weight: 400; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .lv {
    appearance: none; border: 0; cursor: pointer; font: inherit;
    background: var(--board); color: var(--ink);
    border-radius: var(--r);
    box-shadow: var(--paper-shadow);
    padding: 8px 0 6px; min-height: 54px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.15;
  }
  .lv .l { font-size: 20px; }
  .lv .pt { font-size: 13px; font-variant-numeric: tabular-nums; }
  .lv:hover { background: #fff; }
  .lv[aria-pressed="true"] { background: var(--c); color: #fff; font-weight: 700; }

  /* 합계 색종이 */
  .total-bar {
    position: sticky; bottom: 8px; z-index: 5;
    margin-top: 22px;
    background: var(--c5); color: #fff;
    border-radius: var(--r);
    box-shadow: var(--paper-shadow);
    padding: 14px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  }
  .total-num { font-size: 46px; font-variant-numeric: tabular-nums; line-height: 1; }
  .total-num small { font-family: "Gowun Dodum", sans-serif; font-size: 17px; font-weight: 700; }
  .grade-badge {
    width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 30px; background: #fff; color: var(--c5);
    box-shadow: var(--paper-shadow);
  }
  .total-meta { font-size: 15px; font-weight: 700; flex: 1 1 180px; }
  .actions { display: flex; gap: 10px; }

  /* 수정 화면 */
  .settings {
    background: #fff; border-radius: var(--r);
    box-shadow: var(--paper-shadow);
    padding: 0 18px 18px; margin-bottom: 22px; overflow: hidden;
  }
  .settings h2 {
    margin: 0 -18px 12px; padding: 12px 18px;
    background: var(--c5); color: #fff;
    font-size: clamp(22px, 2.6vw, 28px); line-height: 1.2;
  }
  .settings .lead { margin: 0 0 12px; font-size: 15px; }
  .set-project { padding: 12px 0; }
  .set-project + .set-project { box-shadow: 0 -2px 0 var(--board); }
  .set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
  .set-row label { font-weight: 700; min-width: 80px; }
  .settings input[type="text"] {
    font: inherit; color: var(--ink); background: var(--board);
    border: 0; border-radius: var(--r); box-shadow: inset 0 2px 0 var(--shade);
    padding: 6px 12px; flex: 1 1 200px; min-width: 0;
  }
  .set-item { background: var(--board); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
  .set-item input[type="text"] { background: #fff; }
  .pts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .pts label { display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: 700; gap: 2px; }
  .pts input {
    width: 100%; font: inherit; text-align: center; color: var(--ink);
    background: #fff; border: 0; border-radius: var(--r); box-shadow: var(--paper-shadow);
    padding: 6px 2px; font-variant-numeric: tabular-nums;
  }
  .sum-check { display: inline-block; font-size: 15px; font-weight: 700; color: #fff; padding: 2px 12px; border-radius: var(--r); }
  .sum-check.ok { background: var(--c3); }
  .sum-check.bad { background: var(--c1); }
  .set-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .set-actions .spacer { flex: 1; }
  .set-error { color: #fff; background: var(--c1); border-radius: var(--r); padding: 6px 12px; font-size: 15px; margin-top: 10px; }

  /* 기록 표 */
  .records { margin-top: 48px; }
  .records-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .records-head h2 {
    display: inline-block; margin: 0;
    background: var(--c3); color: #fff;
    font-size: clamp(26px, 3.6vw, 38px); line-height: 1.2;
    padding: 6px 18px; border-radius: var(--r); box-shadow: var(--paper-shadow);
  }
  .records-head h2 span { font-family: "Gowun Dodum", sans-serif; font-size: 17px; font-weight: 700; }
  .records-head .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .table-scroll { overflow-x: auto; background: #fff; border-radius: var(--r); box-shadow: var(--paper-shadow); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 16px; }
  th, td { padding: 8px 12px; text-align: center; border-bottom: 2px solid var(--board); white-space: nowrap; }
  thead th { font-weight: 700; background: #fff; }
  thead tr:first-child th.pg0 { background: var(--c4); color: #fff; }
  thead tr:first-child th.pg1 { background: var(--c1); color: #fff; }
  td .lt { font-size: 13px; margin-left: 3px; opacity: .75; }
  td.sub { font-weight: 700; }
  td.sum, td.grd { font-weight: 700; font-size: 18px; }
  tr.just td { background: var(--c3); color: #fff; }
  tr.cur td { background: var(--c2); }
  .del { appearance: none; border: 0; background: var(--c1); color: #fff; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: var(--r); }
  tr.just .del { background: #fff; color: var(--c1); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .empty { padding: 32px 16px; text-align: center; }

  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    background: var(--ink); color: var(--board);
    padding: 10px 20px; border-radius: var(--r); font-weight: 700;
    box-shadow: var(--paper-shadow);
    opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 20; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  .warn { margin-top: 12px; color: #fff; background: var(--c1); border-radius: var(--r); padding: 6px 12px; font-size: 15px; }
  .warn[hidden] { display: none; }

  @media (max-width: 760px) {
    .wrap, .top .inner { padding-left: 14px; padding-right: 14px; }
    .top { padding: 26px 0 44px; }
    .lv { min-height: 50px; }
    .total-num { font-size: 38px; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
    .student .hint { margin-left: 0; width: 100%; }
    .student select { min-width: 72px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    button.btn:active { transform: none; }
  }

  /* ---------- 학생별 채점표 인쇄 (A4 한 장에 2명) ---------- */
  #printArea { display: none; }
  @page { size: A4 portrait; margin: 10mm; }
  @media print {
    html, body { background: #fff; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  .sheet { break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .slip {
    height: 133mm;
    background: var(--board);
    border-radius: 2mm;
    padding: 5mm;
    display: flex; flex-direction: column; gap: 3.5mm;
    font-size: 11pt; line-height: 1.4;
    break-inside: avoid; page-break-inside: avoid;
  }
  .cut {
    height: 11mm; display: flex; align-items: center; gap: 3mm;
    font-size: 8.5pt; color: var(--ink); opacity: .6;
  }
  .cut::before, .cut::after { content: ""; flex: 1; border-top: 0.4mm dashed var(--shade); }
  .slip-head {
    display: flex; align-items: center; justify-content: space-between; gap: 4mm;
    background: #fff; border-radius: 1.5mm; box-shadow: 0 0.8mm 0 var(--shade);
    padding: 2.5mm 4mm;
  }
  .slip-title { font-size: 9.5pt; }
  .slip-who { font-family: "Black Han Sans", sans-serif; font-size: 18pt; line-height: 1.1; }
  .slip-score { display: flex; align-items: center; gap: 3mm; background: var(--c5); color: #fff; border-radius: 1.5mm; padding: 1.5mm 3mm; }
  .slip-score b { font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 22pt; line-height: 1; }
  .slip-score small { font-size: 10pt; font-weight: 700; }
  .slip-grade {
    width: 11mm; height: 11mm; border-radius: 50%; background: #fff; color: var(--c5);
    display: grid; place-items: center;
    font-family: "Black Han Sans", sans-serif; font-size: 17pt;
  }
  .slip-projects { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; flex: 1; }
  .sp { background: #fff; border-radius: 1.5mm; box-shadow: 0 0.8mm 0 var(--shade); overflow: hidden; display: flex; flex-direction: column; }
  .sp[data-p="0"] { --c: var(--c4); }
  .sp[data-p="1"] { --c: var(--c1); }
  .sp-head { display: flex; justify-content: space-between; align-items: baseline; background: var(--c); color: #fff; padding: 2mm 3mm; }
  .sp-head h3 { margin: 0; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 13pt; }
  .sp-head span { font-weight: 700; font-size: 10pt; white-space: nowrap; }
  .sp-head span b { font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 15pt; }
  .sp-body { padding: 0 3mm 2mm; flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .sp-item { padding: 1.5mm 0; }
  .sp-item + .sp-item { box-shadow: 0 -0.5mm 0 var(--board); }
  .sp-name { display: flex; justify-content: space-between; gap: 2mm; font-weight: 700; font-size: 10.5pt; margin-bottom: 1.2mm; }
  .sp-name span:last-child { font-weight: 400; font-size: 9pt; white-space: nowrap; }
  .sp-levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.2mm; }
  .sp-lv {
    background: var(--board); border-radius: 1.2mm; box-shadow: 0 0.6mm 0 var(--shade);
    text-align: center; padding: 1mm 0 0.6mm; line-height: 1.1;
  }
  .sp-lv b { display: block; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 12pt; }
  .sp-lv i { font-style: normal; font-size: 8pt; }
  .sp-lv.on { background: var(--c); color: #fff; font-weight: 700; }
</style>
</head>
<body>
<div class="top"><div class="inner">
  <header>
    <h1 id="title"></h1>
    <button class="btn btn-line" id="editBtn" type="button" aria-expanded="false" aria-controls="settings">항목·배점 수정</button>
  </header>
</div></div>
<div class="wrap">

  <section class="settings" id="settings" hidden aria-labelledby="setTitle"></section>

  <section class="student" aria-label="학생 선택">
    <label>학년 <select id="selGrade"></select></label>
    <label>반 <select id="selClass"></select></label>
    <label>번호 <select id="selNo"></select></label>
    <span class="hint" id="studentHint"></span>
  </section>

  <section class="projects" id="projects" aria-label="채점 항목"></section>

  <div class="total-bar" aria-live="polite">
    <div class="total-num"><span id="total">0</span><small> / <span id="max">100</span></small></div>
    <div class="grade-badge" id="grade">–</div>
    <div class="total-meta" id="meta"></div>
    <div class="actions">
      <button class="btn btn-clear" id="clearBtn" type="button">다시 고르기</button>
      <button class="btn btn-save" id="saveBtn" type="button">저장</button>
    </div>
  </div>
  <div class="warn" id="warn" hidden></div>

  <section class="records">
    <div class="records-head">
      <h2>저장한 기록 <span id="count"></span></h2>
      <div class="tools">
        <button class="btn btn-line" id="copyBtn" type="button">표 복사 (엑셀용)</button>
        <button class="btn btn-primary" id="pdfBtn" type="button">PDF 다운</button>
        <button class="btn btn-danger" id="wipeBtn" type="button">기록 모두 지우기</button>
      </div>
    </div>
    <div class="table-scroll">
      <table id="table"></table>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea" aria-hidden="true"></div>

<script>
(() => {
  const L = CONFIG.LEVELS;
  const S = CONFIG.STUDENT;
  const REC_KEY = CONFIG.STORAGE_KEY;
  const SET_KEY = CONFIG.STORAGE_KEY + "-settings";
  const $ = (id) => document.getElementById(id);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  let P = clone(CONFIG.PROJECTS);              // 지금 쓰는 항목·배점
  let selection = [];                          // selection[p][i] = 단계 번호 또는 null
  let records = [];
  let storageOK = true;
  let lastSavedId = null;
  let dirty = false;          // 저장하지 않은 선택이 있는지
  let prevStudent = null;     // 드롭다운을 되돌릴 때 쓰는 직전 학생

  /* ---------- 저장소 ---------- */
  function readJSON(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { storageOK = false; return null; }
  }
  function writeJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); storageOK = true; }
    catch (e) { storageOK = false; }
    showStorageWarn();
  }
  function removeKey(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function showStorageWarn() {
    $("warn").hidden = storageOK;
    $("warn").textContent = storageOK ? "" :
      "이 브라우저에서는 기록을 보관할 수 없습니다. 파일을 내려받아 크롬이나 엣지로 직접 열어 주세요.";
  }
  function validProjects(v) {
    return Array.isArray(v) && v.length === CONFIG.PROJECTS.length &&
      v.every((p, pi) => p && typeof p.name === "string" && Array.isArray(p.items) &&
        p.items.length === CONFIG.PROJECTS[pi].items.length &&
        p.items.every(it => typeof it.name === "string" && Array.isArray(it.points) && it.points.length === L.length));
  }
  function load() {
    const r = readJSON(REC_KEY);
    records = Array.isArray(r) ? r : [];
    records.forEach((x, i) => { if (!x.id) x.id = "old" + i; });
    const s = readJSON(SET_KEY);
    if (validProjects(s)) P = s;
  }
  const persistRecords = () => writeJSON(REC_KEY, records);

  /* ---------- 계산 ---------- */
  const emptySelection = () => P.map(p => p.items.map(() => null));
  const maxOf = (p) => P[p].items.reduce((s, it) => s + Math.max(...it.points), 0);
  const maxTotal = () => P.reduce((s, _, p) => s + maxOf(p), 0);
  const subtotal = (p) => P[p].items.reduce((s, it, i) => s + (selection[p][i] == null ? 0 : it.points[selection[p][i]]), 0);
  const total = () => P.reduce((s, _, p) => s + subtotal(p), 0);
  function gradeOf(score) {
    for (const g of CONFIG.FINAL_GRADES) {
      if (g.inclusive ? score >= g.min : score > g.min) return g.grade;
    }
    return CONFIG.FINAL_GRADES[CONFIG.FINAL_GRADES.length - 1].grade;
  }
  const allPicked = () => selection.every(p => p.every(v => v != null));
  const pickedCount = () => selection.flat().filter(v => v != null).length;
  const itemCount = () => selection.flat().length;

  /* ---------- 학생 선택 ---------- */
  function fillSelect(sel, values, unit) {
    sel.innerHTML = values.map(v => `<option value="${v}">${v}${unit}</option>`).join("");
  }
  function buildStudent() {
    fillSelect($("selGrade"), S.GRADES, "학년");
    fillSelect($("selClass"), S.CLASSES, "반");
    fillSelect($("selNo"), Array.from({ length: S.MAX_NUMBER }, (_, i) => i + 1), "번");
    ["selGrade", "selClass", "selNo"].forEach(id => $(id).addEventListener("change", onStudentChange));
  }
  function setStudent(st) {
    $("selGrade").value = st.g; $("selClass").value = st.c; $("selNo").value = st.n;
  }
  function onStudentChange() {
    if (dirty && prevStudent && !confirm(`${label(prevStudent)}의 점수를 아직 저장하지 않았습니다. 저장하지 않고 학생을 바꿀까요?`)) {
      setStudent(prevStudent);
      return;
    }
    loadStudent();
  }
  // 고른 학생의 마지막 저장 내용을 불러옵니다. 저장된 적이 없으면 빈 채점표로 시작합니다.
  function loadStudent() {
    const st = currentStudent();
    const rec = findRecord(st);
    selection = emptySelection();
    if (rec && Array.isArray(rec.levels)) {
      selection = P.map((proj, p) => proj.items.map((_, i) => {
        const k = L.indexOf(rec.levels?.[p]?.[i]);
        return k >= 0 ? k : null;
      }));
    }
    prevStudent = st;
    dirty = false;
    refresh();
    renderTable();
  }
  const currentStudent = () => ({ g: +$("selGrade").value, c: +$("selClass").value, n: +$("selNo").value });
  const findRecord = (st) => records.find(r => r.g === st.g && r.c === st.c && r.n === st.n);
  function updateHint() {
    const st = currentStudent();
    const ex = findRecord(st);
    const h = $("studentHint");
    h.classList.toggle("exists", !!ex);
    h.textContent = ex
      ? `${st.g}학년 ${st.c}반 ${st.n}번 · 마지막 저장 ${ex.total}점(${ex.grade}) ${timeText(ex.savedAt)}${dirty ? " · 고친 내용은 저장해야 반영됩니다" : ""}`
      : `${st.g}학년 ${st.c}반 ${st.n}번 · 아직 저장한 점수가 없습니다`;
  }

  /* ---------- 채점 화면 ---------- */
  function buildProjects() {
    const box = $("projects");
    box.innerHTML = "";
    P.forEach((proj, p) => {
      const sec = document.createElement("article");
      sec.className = "project";
      sec.dataset.p = p % 2;
      let html = `
        <div class="project-head">
          <h2>${esc(proj.name)}</h2>
          <div class="subtotal"><b id="sub${p}">0</b> / ${maxOf(p)}</div>
        </div>`;
      proj.items.forEach((it, i) => {
        html += `<div class="item">
          <div class="item-name"><span>${esc(it.name)}</span><span id="pt${p}_${i}">–</span></div>
          <div class="levels" role="group" aria-label="${esc(proj.name)} ${esc(it.name)}">`;
        L.forEach((letter, k) => {
          html += `<button type="button" class="lv" data-p="${p}" data-i="${i}" data-k="${k}" aria-pressed="false"
                    aria-label="${esc(letter)}, ${it.points[k]}점"><span class="l">${esc(letter)}</span><span class="pt">${it.points[k]}</span></button>`;
        });
        html += `</div></div>`;
      });
      sec.innerHTML = html;
      box.appendChild(sec);
    });
    $("max").textContent = maxTotal();
  }
  $("projects").addEventListener("click", (e) => {
    const b = e.target.closest(".lv");
    if (!b) return;
    const p = +b.dataset.p, i = +b.dataset.i, k = +b.dataset.k;
    selection[p][i] = selection[p][i] === k ? null : k;   // 같은 단추를 다시 누르면 해제
    dirty = true;
    refresh();
    updateHint();
  });

  function refresh() {
    document.querySelectorAll(".lv").forEach(b => {
      const on = selection[+b.dataset.p][+b.dataset.i] === +b.dataset.k;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    P.forEach((proj, p) => {
      $("sub" + p).textContent = subtotal(p);
      proj.items.forEach((it, i) => {
        const v = selection[p][i];
        $(`pt${p}_${i}`).textContent = v == null ? "–" : `${L[v]} · ${it.points[v]}점`;
      });
    });
    const t = total();
    $("total").textContent = t;
    const done = allPicked();
    $("grade").textContent = done ? gradeOf(t) : "–";
    $("meta").textContent = done
      ? "모든 항목을 골랐습니다. 저장을 누르세요."
      : `${itemCount()}개 항목 중 ${pickedCount()}개를 골랐습니다.`;
  }

  /* ---------- 수정 화면 ---------- */
  function openSettings() {
    const box = $("settings");
    let html = `<h2 id="setTitle">항목·배점 수정</h2>
      <p class="lead">배점은 A부터 F까지 순서대로 적어 주세요. 이미 저장한 기록의 점수는 바뀌지 않습니다.</p>`;
    P.forEach((proj, p) => {
      html += `<div class="set-project">
        <div class="set-row"><label for="sp${p}">프로젝트 ${p + 1}</label>
          <input type="text" id="sp${p}" value="${esc(proj.name)}" maxlength="30"></div>`;
      proj.items.forEach((it, i) => {
        html += `<div class="set-item">
          <div class="set-row"><label for="si${p}_${i}">항목 ${i + 1}</label>
            <input type="text" id="si${p}_${i}" value="${esc(it.name)}" maxlength="30"></div>
          <div class="pts">`;
        L.forEach((letter, k) => {
          html += `<label>${esc(letter)}<input type="number" inputmode="numeric" min="0" max="100" step="1"
                    id="sv${p}_${i}_${k}" value="${it.points[k]}" aria-label="${esc(it.name)} ${esc(letter)} 배점"></label>`;
        });
        html += `</div></div>`;
      });
      html += `<div class="sum-check" id="sc${p}"></div></div>`;
    });
    html += `<div class="set-error" id="setError" hidden></div>
      <div class="set-actions">
        <button class="btn btn-danger" type="button" id="setReset">처음 값으로 되돌리기</button>
        <span class="spacer"></span>
        <button class="btn btn-line" type="button" id="setCancel">취소</button>
        <button class="btn btn-primary" type="button" id="setSave">수정 내용 저장</button>
      </div>`;
    box.innerHTML = html;
    box.hidden = false;
    $("editBtn").setAttribute("aria-expanded", "true");
    $("editBtn").textContent = "수정 닫기";
    box.addEventListener("input", updateSumChecks);
    $("setCancel").addEventListener("click", closeSettings);
    $("setSave").addEventListener("click", saveSettings);
    $("setReset").addEventListener("click", resetSettings);
    updateSumChecks();
    $("sp0").focus();
  }
  function closeSettings() {
    $("settings").hidden = true;
    $("settings").innerHTML = "";
    $("editBtn").setAttribute("aria-expanded", "false");
    $("editBtn").textContent = "항목·배점 수정";
  }
  function updateSumChecks() {
    P.forEach((proj, p) => {
      let sum = 0;
      proj.items.forEach((_, i) => {
        const vals = L.map((_, k) => Number($(`sv${p}_${i}_${k}`).value) || 0);
        sum += Math.max(...vals);
      });
      const el = $("sc" + p);
      const full = CONFIG.PROJECT_FULL_SCORE;
      el.className = "sum-check " + (sum === full ? "ok" : "bad");
      el.textContent = sum === full
        ? `가장 높은 배점의 합계: ${sum}점 (만점 ${full}점과 같습니다)`
        : `가장 높은 배점의 합계: ${sum}점 (만점 ${full}점과 다릅니다)`;
    });
  }
  function saveSettings() {
    const next = [];
    const errors = [];
    P.forEach((proj, p) => {
      const name = $("sp" + p).value.trim();
      if (!name) errors.push(`프로젝트 ${p + 1}의 이름을 적어 주세요.`);
      const items = proj.items.map((_, i) => {
        const iname = $(`si${p}_${i}`).value.trim();
        if (!iname) errors.push(`프로젝트 ${p + 1}의 항목 ${i + 1} 이름을 적어 주세요.`);
        const points = L.map((letter, k) => {
          const raw = $(`sv${p}_${i}_${k}`).value;
          const n = Number(raw);
          if (raw === "" || !Number.isFinite(n) || n < 0) {
            errors.push(`프로젝트 ${p + 1} 항목 ${i + 1}의 ${letter} 배점을 0 이상의 숫자로 적어 주세요.`);
            return 0;
          }
          return Math.round(n * 10) / 10;
        });
        return { name: iname, points };
      });
      next.push({ name, items });
    });
    const errBox = $("setError");
    if (errors.length) {
      errBox.hidden = false;
      errBox.textContent = errors[0] + (errors.length > 1 ? ` 외 ${errors.length - 1}건` : "");
      return;
    }
    const off = next.some(p => p.items.reduce((s, it) => s + Math.max(...it.points), 0) !== CONFIG.PROJECT_FULL_SCORE);
    if (off && !confirm(`만점이 ${CONFIG.PROJECT_FULL_SCORE}점이 아닌 프로젝트가 있습니다. 그래도 저장할까요?`)) return;
    P = next;
    writeJSON(SET_KEY, P);
    applyProjects();
    closeSettings();
    toast("항목과 배점을 수정했습니다.");
  }
  function resetSettings() {
    if (!confirm("항목 이름과 배점을 코드 맨 위의 처음 값으로 되돌릴까요?")) return;
    P = clone(CONFIG.PROJECTS);
    removeKey(SET_KEY);
    applyProjects();
    closeSettings();
    toast("처음 값으로 되돌렸습니다.");
  }
  function applyProjects() {
    selection = emptySelection();
    buildProjects();
    loadStudent();
  }

  /* ---------- 기록 표 ---------- */
  const sortRecords = () => records.sort((a, b) => (a.g - b.g) || (a.c - b.c) || (a.n - b.n));
  function headerCells() {
    const cols = ["학년", "반", "번호"];
    P.forEach(proj => {
      proj.items.forEach(it => cols.push(`${proj.name} ${it.name}`));
      cols.push(`${proj.name} 소계`);
    });
    cols.push("최종 점수", "최종 등급");
    return cols;
  }
  const show = (v) => (v == null ? "" : v);
  function rowValues(r) {
    const v = [show(r.g), show(r.c), show(r.n)];
    P.forEach((proj, p) => {
      proj.items.forEach((_, i) => v.push(show(r.scores?.[p]?.[i])));
      v.push(show(r.subtotals?.[p]));
    });
    v.push(r.total, r.grade);
    return v;
  }
  function renderTable() {
    const tbl = $("table");
    $("count").textContent = records.length ? `${records.length}명` : "";
    updateHint();
    if (!records.length) {
      tbl.innerHTML = `<tbody><tr><td class="empty">아직 저장한 기록이 없습니다. 학생을 고르고 단계를 누른 뒤 저장하세요.</td></tr></tbody>`;
      return;
    }
    sortRecords();
    let h1 = `<tr><th rowspan="2">학년</th><th rowspan="2">반</th><th rowspan="2">번호</th>`;
    let h2 = `<tr>`;
    P.forEach((proj, p) => {
      h1 += `<th class="pg${p % 2}" colspan="${proj.items.length + 1}">${esc(proj.name)}</th>`;
      proj.items.forEach(it => { h2 += `<th>${esc(it.name)}</th>`; });
      h2 += `<th>소계</th>`;
    });
    h1 += `<th rowspan="2">최종 점수</th><th rowspan="2">등급</th><th rowspan="2"><span class="sr">삭제</span></th></tr>`;
    h2 += `</tr>`;

    let body = "";
    records.forEach((r) => {
      const cur = prevStudent && r.g === prevStudent.g && r.c === prevStudent.c && r.n === prevStudent.n;
      body += `<tr${r.id === lastSavedId ? ' class="just"' : cur ? ' class="cur"' : ""}><td>${show(r.g)}</td><td>${show(r.c)}</td><td>${show(r.n)}</td>`;
      P.forEach((proj, p) => {
        proj.items.forEach((_, i) => {
          body += `<td>${show(r.scores?.[p]?.[i])}<span class="lt">${esc(show(r.levels?.[p]?.[i]))}</span></td>`;
        });
        body += `<td class="sub">${show(r.subtotals?.[p])}</td>`;
      });
      body += `<td class="sum">${r.total}</td><td class="grd">${esc(r.grade)}</td>
               <td><button class="del" type="button" data-id="${esc(r.id)}" aria-label="${label(r)} 기록 삭제">삭제</button></td></tr>`;
    });
    tbl.innerHTML = `<thead>${h1}${h2}</thead><tbody>${body}</tbody>`;
  }
  function timeText(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const pad = (x) => String(x).padStart(2, "0");
    return `(${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())})`;
  }
  const label = (r) => r.g != null ? `${r.g}학년 ${r.c}반 ${r.n}번` : "이";

  /* ---------- 동작 ---------- */
  function save() {
    if (!allPicked()) {
      toast(`아직 고르지 않은 항목이 ${itemCount() - pickedCount()}개 있습니다.`);
      return;
    }
    const st = currentStudent();
    const existing = findRecord(st);

    const t = total();
    const rec = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      g: st.g, c: st.c, n: st.n,
      levels: selection.map(p => p.map(k => L[k])),
      scores: selection.map((p, pi) => p.map((k, i) => P[pi].items[i].points[k])),
      subtotals: P.map((_, p) => subtotal(p)),
      total: t,
      grade: gradeOf(t),
      savedAt: new Date().toISOString(),
    };
    if (existing) records.splice(records.indexOf(existing), 1, rec);
    else records.push(rec);
    lastSavedId = rec.id;
    persistRecords();
    toast(`${label(st)} ${t}점(${rec.grade})을 저장했습니다.`);

    // 다음 번호로 넘어가기
    const noSel = $("selNo");
    dirty = false;
    if (noSel.selectedIndex < noSel.options.length - 1) noSel.selectedIndex += 1;
    loadStudent();
    window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  function copyTable() {
    if (!records.length) { toast("복사할 기록이 없습니다."); return; }
    sortRecords();
    const text = [headerCells().join("\t"), ...records.map(r => rowValues(r).join("\t"))].join("\n");
    const done = () => toast("표를 복사했습니다. 엑셀에서 붙여넣기 하세요.");
    const fail = () => toast("복사하지 못했습니다.");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text) ? done() : fail());
    } else {
      fallbackCopy(text) ? done() : fail();
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  /* ---------- 학생별 채점표 PDF (인쇄 → PDF로 저장) ---------- */
  function buildPrint() {
    sortRecords();
    const maxT = maxTotal();
    const slip = (r) => {
      const who = r.g != null ? `${r.g}학년 ${r.c}반 ${r.n}번` : "학생 정보 없음";
      let html = `<div class="slip">
        <div class="slip-head">
          <div><div class="slip-title">${esc(CONFIG.TITLE)}</div><div class="slip-who">${esc(who)}</div></div>
          <div class="slip-score"><b>${r.total}</b><small>/ ${maxT}</small><div class="slip-grade">${esc(r.grade)}</div></div>
        </div>
        <div class="slip-projects">`;
      P.forEach((proj, p) => {
        const pMax = maxOf(p);
        html += `<div class="sp" data-p="${p % 2}">
          <div class="sp-head"><h3>${esc(proj.name)}</h3><span><b>${show(r.subtotals?.[p])}</b> / ${pMax}</span></div>
          <div class="sp-body">`;
        proj.items.forEach((it, i) => {
          const lv = r.levels?.[p]?.[i];
          const sc = r.scores?.[p]?.[i];
          html += `<div class="sp-item">
            <div class="sp-name"><span>${esc(it.name)}</span><span>${lv != null ? `${esc(lv)} · ${sc}점` : "–"}</span></div>
            <div class="sp-levels">`;
          L.forEach((letter, k) => {
            html += `<div class="sp-lv${letter === lv ? " on" : ""}"><b>${esc(letter)}</b><i>${it.points[k]}</i></div>`;
          });
          html += `</div></div>`;
        });
        html += `</div></div>`;
      });
      return html + `</div></div>`;
    };
    let out = "";
    for (let i = 0; i < records.length; i += 2) {
      out += `<div class="sheet">${slip(records[i])}`;
      if (records[i + 1]) out += `<div class="cut">자르는 선</div>${slip(records[i + 1])}`;
      out += `</div>`;
    }
    $("printArea").innerHTML = out;
  }
  function downloadPDF() {
    if (!records.length) { toast("PDF로 만들 기록이 없습니다."); return; }
    buildPrint();
    const oldTitle = document.title;
    document.title = `${CONFIG.TITLE}_학생별`;   // PDF 파일 이름으로 쓰입니다
    const finish = () => { document.title = oldTitle; $("printArea").innerHTML = ""; };
    window.addEventListener("afterprint", finish, { once: true });
    toast("인쇄 창에서 대상(프린터)을 'PDF로 저장'으로 고르세요.");
    const go = () => setTimeout(() => window.print(), 150);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- 시작 ---------- */
  document.title = CONFIG.TITLE;
  $("title").textContent = CONFIG.TITLE;
  load();
  buildStudent();
  selection = emptySelection();
  buildProjects();
  loadStudent();
  showStorageWarn();

  $("editBtn").addEventListener("click", () => $("settings").hidden ? openSettings() : closeSettings());
  $("saveBtn").addEventListener("click", save);
  $("clearBtn").addEventListener("click", () => { selection = emptySelection(); dirty = !!findRecord(currentStudent()); refresh(); updateHint(); });
  $("copyBtn").addEventListener("click", copyTable);
  $("pdfBtn").addEventListener("click", downloadPDF);
  $("wipeBtn").addEventListener("click", () => {
    if (!records.length) return;
    if (confirm(`저장한 기록 ${records.length}개를 모두 지울까요? 되돌릴 수 없습니다.`)) {
      records = []; persistRecords(); if (!dirty) loadStudent(); else renderTable(); toast("기록을 모두 지웠습니다.");
    }
  });
  $("table").addEventListener("click", (e) => {
    const b = e.target.closest(".del");
    if (!b) return;
    const idx = records.findIndex(r => r.id === b.dataset.id);
    if (idx < 0) return;
    if (confirm(`${label(records[idx])} 기록을 지울까요?`)) {
      const wasCurrent = prevStudent && records[idx].g === prevStudent.g && records[idx].c === prevStudent.c && records[idx].n === prevStudent.n;
      records.splice(idx, 1); persistRecords();
      if (wasCurrent && !dirty) loadStudent(); else renderTable();
    }
  });
})();
</script>
</body>
</html>
